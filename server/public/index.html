<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nessie</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div id="led" class="led"></div>
        <h1>Nessie</h1>
      </div>
      <div class="header-right">
        <span id="device-id" class="device-id"></span>
        <span id="status-badge" class="status-badge">Ready</span>
      </div>
    </header>

    <main id="chat-area">
      <div class="message nessie">
        <div class="message-bubble">
          <p>Hi there! Press and hold the big button to talk to me, or type below.</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="input-row">
        <button
          id="mic-btn"
          type="button"
          class="mic-btn"
          aria-label="Push to talk"
        >
          <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" role="img">
            <title>Microphone</title>
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <div class="text-input-group">
          <input
            id="text-input"
            type="text"
            placeholder="Or type a message..."
            autocomplete="off"
          />
          <button id="send-btn" type="button" class="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" role="img">
              <title>Send</title>
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="transcript-preview" class="transcript-preview" hidden>
        <span class="transcript-label">Hearing:</span>
        <span id="transcript-text"></span>
      </div>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
